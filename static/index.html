<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Escucha</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="brand">Escucha</div>
  <div class="hright"><button id="sceneChip" class="chip" aria-label="当前场合，点开更改">日常</button><span id="mode" class="sr" role="status">…</span><button id="langBtn" class="langbtn" aria-label="语言：点开更改"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></svg><span id="langTxt">中⇄西</span></button></div>
</header>
<div id="sceneHint" hidden role="status"><span id="sceneHintText"></span> · <button id="sceneUndo" class="link" data-ta="sceneUndoAria" data-t="sceneUndo" aria-label="改回原来的场合">改</button></div>
<details id="facts" hidden><summary data-ta="factsAria" aria-label="已知信息清单，点开查看"><span id="factsHead">已知 0 项：</span><span id="factsBrief"></span><span id="factsCount" hidden>0</span></summary><ul id="factsList"></ul></details>
<div id="status" data-t="status0">点下方按钮开始。麦克风会一直开着，不会因为显示字幕而停止。</div>
<section id="forThem" hidden>
  <div class="ft-es" id="ftEs"></div>
  <div class="ft-zh" id="ftZh"></div>
</section>
<main id="captions"></main>
<section id="duo" data-ta="duoSecAria" aria-label="对坐模式">
  <div class="hwrap"><div id="duoThem" class="half them" lang="es" data-ta="duoThemAria" aria-label="对方半屏"></div><button id="newThem" class="newest rot" hidden aria-label="Ir a lo último">Último ↓</button></div>
  <div class="duoDiv" aria-hidden="true"><span class="db dbThem" id="dbThem">ES</span><i></i><span class="db dbMe" id="dbMe">中</span></div>
  <div class="hwrap"><div id="duoMe" class="half mine" lang="zh" data-ta="duoMeAria" aria-label="我的半屏"></div><button id="newMe" class="newest" hidden data-ta="newMeAria" data-t="newMe" aria-label="回到最新">最新 ↓</button></div>
</section>
<div id="partial" class="partial" aria-live="polite"></div>
<div id="sugg" data-ta="suggBox" aria-label="建议回答"></div>
<form id="typeForm" data-ta="typeFormAria" aria-label="打字说话"><input id="typeBox" placeholder="打字说中文，翻成西语读给对方" aria-label="输入要说的话" autocomplete="off"><button id="typeSend" class="icb" data-ta="send" aria-label="翻译并朗读"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 12l16-8-6 16-2.5-6.5z"/></svg></button></form>
<footer>
  <span id="mic" class="sr" role="status" data-t="micOff">麦克风：未开启</span>
  <button id="gear" class="tb" data-ta="settingsAria" aria-label="设置：场合和朗读"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span data-t="settings">设置</span></button>
  <button id="duoBtn" class="tb" data-ta="duoBtnAria" aria-label="对坐模式开关" aria-pressed="false"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="5" y="2.5" width="14" height="19" rx="2.5"/><path d="M5 12h14M9 7.5l3-2 3 2M9 16.5l3 2 3-2"/></svg><span data-t="duo">对坐</span></button>
  <button id="go" class="mic" data-ta="startAria" aria-label="开始收听"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"/></svg><span id="goLbl" data-t="start">开始</span><i class="meter"><b id="level"></b></i></button>
  <button id="show" class="tb" data-ta="showAria" aria-label="全屏给对方看我的话"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/><path d="M8 10.5h8"/></svg><span data-t="show">给对方</span></button>
  <button id="endBtn" class="tb" data-ta="endAria" aria-label="结束对话"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg><span data-t="end">结束</span></button>
</footer>
<div id="sheet" hidden>
  <div class="sheet-box">
    <div class="sheet-head"><b data-t="settingsTitle">设置</b><button id="closeSheet" class="ghost" data-ta="closeSettingsAria" data-t="done" aria-label="关闭设置">完成</button></div>
    <div class="sec" data-t="sceneSec">场合（AI 会自动判断）</div>
    <nav id="scenes" role="radiogroup" data-ta="scenesAria" aria-label="场合">
  <button data-s="daily" role="radio" data-t="scene_daily">日常</button><button data-s="doctor" role="radio" data-t="scene_doctor">看医生</button><button data-s="school" role="radio" data-t="scene_school">学校</button><button data-s="bank" role="radio" data-t="scene_bank">银行</button><button data-s="gov" role="radio" data-t="scene_gov">政府办事</button>
</nav>
    <div class="sec" data-t="readSec">朗读</div>
    <label class="opt"><input type="checkbox" id="autoSpeak" checked data-ta="readMine" aria-label="朗读我的话给对方"> <span data-t="readMine">朗读我的话给对方</span></label>
    <label class="opt"><input type="checkbox" id="readTheirs" data-ta="readTheirsAria" aria-label="朗读对方的话给我"> <span data-t="readTheirs">朗读对方的话给我（小声）</span></label>
    <label class="opt"><span data-t="voice">朗读声音</span> <select id="voice" data-ta="voice" aria-label="朗读声音"></select></label>
    <button id="testVoice" class="ghost" data-ta="testAria" data-t="test" aria-label="试听声音">试听</button>
    <p class="hint" id="ttsNote" data-t="ttsNote">真人感声音由 Soniox 生成（需联网，约每小时 0.7 美元）。</p>
  </div>
</div>
<div id="langSheet" class="panel" hidden role="dialog" data-ta="langSheetAria" aria-label="语言设置">
  <div class="sheet-head"><b data-t="langTitle">语言</b><button id="langClose" class="ghost sm" data-ta="done" data-t="done" aria-label="完成">完成</button></div>
  <label class="lrow"><span data-t="myLang">我的语言</span><select id="langMe" data-ta="myLang" aria-label="我的语言"></select></label>
  <button id="langSwap" class="ghost swap" data-ta="swapAria" aria-label="互换两种语言"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"/></svg><span data-t="swap">互换</span></button>
  <label class="lrow"><span data-t="theirLang">对方的语言</span><select id="langThem" data-ta="theirLang" aria-label="对方的语言"></select></label>
  <p class="hint" id="langWarn" hidden data-t="langWarn">两种语言不能相同。</p>
  <p class="hint" data-t="langNote">识别、翻译、朗读都支持这些语言。收听中改语言会自动重新连接。</p>
</div>
<div id="full" hidden><button id="rot" class="ghost" data-ta="rotAria" data-t="rot" aria-label="翻转 180 度">翻转 180°</button><div id="fullEs"></div><div id="fullZh"></div><button id="closeFull" class="ghost" data-ta="closeFullAria" data-t="close" aria-label="关闭全屏">关闭</button></div>
<div id="endSheet" class="panel" hidden role="dialog" data-ta="missTitle" aria-label="还没问">
  <div class="sheet-head"><b data-t="missTitle">还没问</b><button id="endClose" class="ghost sm" data-ta="continue" data-t="continue" aria-label="继续对话">继续对话</button></div>
  <p class="hint" id="missHint">整场对话里还没提到的重要事项，点一下就用西语问对方：</p>
  <div id="missingList"></div>
  <button id="toSummary" data-ta="toSummary" data-t="toSummary" aria-label="结束并生成纪要">结束并生成纪要</button>
</div>
<div id="sumSheet" class="panel" hidden role="dialog" data-ta="sumTitle" aria-label="对话纪要">
  <div class="sheet-head"><b data-t="sumTitle">对话纪要</b><button id="sumClose" class="ghost sm" data-ta="closeSumAria" data-t="close" aria-label="关闭纪要">关闭</button></div>
  <div id="sumBody">生成中…</div>
  <div class="row"><button id="sumCopy" class="ghost" data-ta="copyAria" data-t="copy" aria-label="复制纪要">复制</button><button id="sumIcs" class="ghost" data-ta="icsAria" data-t="ics" aria-label="把待办加入日历">加入日历</button></div>
</div>
<script src="/static/lang.js"></script>
<script src="/static/i18n.js"></script>
<script src="/static/echo.js"></script>
<script src="/static/app.js"></script>
<script src="/static/assist-ui.js"></script>
</body>
</html>
